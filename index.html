<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylus and Index</title>
<link rel="stylesheet" href="shared/code/styles.css">
<style>
  body { background-image: url("sylus/output/background.jpg"); overflow: auto; }
  .landing { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px 16px; text-align: center; }
  .landing p { margin: 0; max-width: 34em; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .choice { display: block; min-width: 220px; padding: 18px 24px; color: var(--text); text-decoration: none; font-size: 1.25rem;
    border: var(--box-border); border-radius: 10px; }
  .choice:hover { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .choice small { display: block; margin-top: 4px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="landing">
  <img class="logo" src="sylus/output/logo.svg" alt="Pacifica logo">
  <h1>Student Life</h1>
  <div class="choices">
    <a class="choice" href="sylus/">Sylus<small>Look up students and groups</small></a>
    <a class="choice" href="index/">Index<small>Add students and manage groups</small></a>
  </div>
  <p>This is a demo. All students are made up. Changes made in Index stay in your browser and don't appear in Sylus.</p>
</div>
</body>
</html>
